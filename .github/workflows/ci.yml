name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Verify golden protocol vectors are up to date
        run: |
          python tools/make_golden.py
          git diff --exit-code native/tests/golden.h

      - name: Build & test native C core (MSVC)
        shell: cmd
        run: native\build.bat test

      - name: Run Python test suite & offline selftest
        run: |
          python -m pytest -q
          python main.py --selftest
          python main.py --doctor || echo "doctor exited with non-zero on CI runner as expected"

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Verify golden protocol vectors are up to date
        run: |
          python tools/make_golden.py
          git diff --exit-code native/tests/golden.h

      - name: Build & test native C core (GCC)
        run: make -C native test

      - name: Run Python test suite & offline selftest
        run: |
          python -m pytest -q
          python main.py --selftest
          python main.py --doctor || echo "doctor exited with non-zero on CI runner as expected"

      - name: Check Linux installer shell syntax
        run: |
          sh -n installer/linux/install.sh
          bash -n installer/linux/install.sh
