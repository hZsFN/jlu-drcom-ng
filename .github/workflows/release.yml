name: Release Linux Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.2.1)'
        required: true
        default: 'v2.2.1'

permissions:
  contents: write

jobs:
  linux-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build and Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev rpm dpkg zstd libarchive-tools

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Build and test native C core (drcomd)
        run: make -C native test

      - name: Run Python test suite
        run: python -m pytest -q

      - name: Build Linux desktop bundle (PyInstaller + Flet runtime)
        run: python build.py --fetch-runtime

      - name: Package tar.gz, deb, rpm, and Arch pkg.tar.zst
        run: |
          python tools/make_release.py --with-bundle --with-drcomd --skip-clean-check
          python tools/make_linux_packages.py

      - name: Verify generated .deb, .rpm, and .pkg.tar.zst packages
        run: |
          dpkg-deb -I release/*.deb
          dpkg-deb -c release/*.deb | head -n 30
          rpm -qpi release/*.rpm
          rpm -qp --requires release/*.rpm
          tar --zstd -tf release/*.pkg.tar.zst | head -n 30

      - name: Upload Linux packages as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jlu-drcom-ng-linux-packages
          path: |
            release/*.tar.gz
            release/*.deb
            release/*.rpm
            release/*.pkg.tar.zst
            release/SHA256SUMS.txt

      - name: Upload Linux artefacts and merge SHA256SUMS.txt into GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ -n "${TAG_INPUT}" ]; then
            TAG="${TAG_INPUT}"
          fi
          gh release view "${TAG}" >/dev/null 2>&1 || gh release create "${TAG}" --draft --title "${TAG}" --notes "power by 哈基米"
          # Preserve any existing Windows checksums in SHA256SUMS.txt
          gh release download "${TAG}" -p SHA256SUMS.txt -D release --clobber || true
          python tools/make_release.py --merge-checksums --skip-clean-check --tag-override "${TAG}"
          for f in release/*.tar.gz release/*.deb release/*.rpm release/*.pkg.tar.zst release/SHA256SUMS.txt; do
            [ -e "$f" ] || continue
            gh release upload "${TAG}" "$f" --clobber
          done
          gh release edit "${TAG}" --draft=false --latest
