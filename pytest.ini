[pytest]
testpaths = tests
# ``release/`` and ``build/`` hold unpacked copies of the source tree (the
# zip staging area), so a bare ``pytest`` would collect their ``tests/`` too and
# die on an ImportPathMismatchError for ``tests.conftest``.
norecursedirs = release build dist vendor .git docs tools __pycache__
addopts = -q
filterwarnings =
    error::DeprecationWarning:drcom.*
